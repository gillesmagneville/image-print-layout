name: CI

on:
  push:
  pull_request:

# The pure-Go packages (units, layout, model, project, ...) must build and
# test without cgo, on both target platforms. Packages that need GTK4, cairo
# or librsvg will get their own job once the M0 prototype lands.
env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
