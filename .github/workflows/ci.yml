name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The packages other than ui and engine are pure Go and must build and test
# without cgo, on both target platforms. The engine (cairo, librsvg) has its own
# job below; ui (GTK4) and the Windows build of both will follow with M0b.
env:
  CGO_ENABLED: "0"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"

  test:
    name: Vet and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  engine:
    name: Engine (librsvg and cairo, ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # Overrides the workflow-wide CGO_ENABLED=0. The tests that read PDFs
      # need poppler; with CI set, a missing tool fails instead of skipping.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-dev poppler-utils fonts-ibm-plex
      - run: go vet ./internal/engine ./internal/testsvg
      - run: go test -count=1 -v ./internal/engine ./internal/testsvg
