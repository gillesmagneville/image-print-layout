# SPDX-License-Identifier: GPL-3.0-only

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The packages other than ui and engine are pure Go and must build and test
# without cgo, on both target platforms (ui is then a stub that only says the
# program was built without its window). The engine (cairo, librsvg) and the
# window (GTK4) have their own jobs below, and so do the installable packages
# (.deb and .rpm, then the Windows installer).
env:
  CGO_ENABLED: "0"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"

  test:
    name: Vet and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  engine:
    name: Engine (librsvg and cairo, ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # Overrides the workflow-wide CGO_ENABLED=0. The tests that read PDFs
      # need poppler; with CI set, a missing tool fails instead of skipping.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-dev poppler-utils fonts-ibm-plex
      - run: go vet ./internal/engine ./internal/testsvg
      - run: go test -count=1 -v ./internal/engine ./internal/testsvg

  # The window: everything is built with cgo (the program links GTK4), and the
  # tests of the window run on a virtual screen. gotk4 compiles slowly the
  # first time; setup-go keeps the build cache between runs.
  ui:
    name: Window (GTK4, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
      GSK_RENDERER: cairo
      GTK_A11Y: none
      NO_AT_BRIDGE: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK4 and the tools of the virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-dev libgtk-4-dev libgirepository1.0-dev \
            poppler-utils fonts-ibm-plex adwaita-icon-theme xvfb xauth imagemagick
      - run: go vet ./...
      - name: Tests of the window and of the program, on a virtual screen
        run: xvfb-run -a -s "-screen 0 1300x820x24" go test -count=1 -v ./internal/ui ./cmd/svgprintlayout
      - name: Build, then open the window in each language
        run: |
          go build -o "$RUNNER_TEMP/svgprintlayout" ./cmd/svgprintlayout
          mkdir screenshots
          cat > "$RUNNER_TEMP/sample.svg" <<'SVG'
          <?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="5479" viewBox="0 0 1280 5479">
            <rect width="1280" height="5479" fill="#f4f5f8"/>
            <rect width="1280" height="84" fill="#2b3a55"/>
            <text x="24" y="52" font-family="IBM Plex Sans, sans-serif" font-size="28" fill="#ffffff">Plan de test</text>
            <rect x="40" y="150" width="1200" height="60" fill="#ffffff" stroke="#8790a3" stroke-width="1.2"/>
            <rect x="40" y="2600" width="1200" height="60" fill="#ffffff" stroke="#8790a3" stroke-width="1.2"/>
            <rect x="40" y="5300" width="1200" height="60" fill="#ffffff" stroke="#8790a3" stroke-width="1.2"/>
          </svg>
          SVG
          for lang in fr en es de; do
            .github/scripts/screenshot.sh "$RUNNER_TEMP/svgprintlayout" "$lang" "screenshots/$lang-empty.png"
            .github/scripts/screenshot.sh "$RUNNER_TEMP/svgprintlayout" "$lang" "screenshots/$lang-document.png" "$RUNNER_TEMP/sample.svg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 14

  linux-packages:
    name: Linux packages (.deb and .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the build and check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-dev libgtk-4-dev libgirepository1.0-dev \
            rpm lintian appstream desktop-file-utils xvfb xauth imagemagick adwaita-icon-theme
      # The scripts ask which version to build and for a confirmation, like a
      # user's run: "o" answers the confirmation, --no-version-change keeps
      # VERSION as it is. The packages are written at the root of the repository.
      - name: Build the .deb and the .rpm
        run: |
          echo o | ./build-deb.sh --no-version-change
          echo o | ./build-rpm.sh --no-version-change
      - name: Check the .deb with lintian, AppStream and desktop-file-validate
        run: |
          lintian --fail-on error ./*.deb
          dpkg-deb --extract ./*.deb "$RUNNER_TEMP/deb"
          desktop-file-validate "$RUNNER_TEMP"/deb/usr/share/applications/*.desktop
          appstreamcli validate --no-net "$RUNNER_TEMP"/deb/usr/share/metainfo/*.metainfo.xml
      - name: Install the .deb, run it, remove it
        run: |
          sudo apt-get install -y ./*.deb
          svgprintlayout -version
          svgprintlayout -selftest
          man -w svgprintlayout
          for lang in fr es de; do test -f "/usr/share/man/$lang/man1/svgprintlayout.1.gz"; done
          .github/scripts/screenshot.sh /usr/bin/svgprintlayout en "$RUNNER_TEMP/installed.png"
          sudo apt-get remove -y svgprintlayout
          test ! -e /usr/bin/svgprintlayout
      - name: Run the program from the .rpm
        run: |
          rpm -qpi ./*.rpm
          rpm -qpl ./*.rpm
          mkdir "$RUNNER_TEMP/rpm"
          rpm2cpio ./*.rpm | (cd "$RUNNER_TEMP/rpm" && cpio -idm)
          "$RUNNER_TEMP/rpm/usr/bin/svgprintlayout" -selftest
      - name: Check that building twice gives the same files
        run: |
          sha256sum ./*.deb ./*.rpm > "$RUNNER_TEMP/first.sha"
          echo o | ./build-deb.sh --no-version-change >/dev/null
          echo o | ./build-rpm.sh --no-version-change >/dev/null
          sha256sum --check "$RUNNER_TEMP/first.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm
          retention-days: 14
      # Last, because it builds again with other versions and removes the
      # packages: the choice of the next version, the cancelled confirmation,
      # VERSION written only after a successful build.
      - name: Check how the scripts manage VERSION
        run: .github/scripts/test-version-handling.sh

  # Les paquets Linux sont liés aux bibliothèques de la machine qui les a
  # construits. Ce job construit donc le paquet dans un conteneur de chaque
  # distribution visée (famille Debian : .deb ; famille Red Hat : .rpm), l'y
  # installe avec apt ou dnf, et lance le programme installé. Pour une
  # distribution connue pour être trop ancienne (« refus attendu » : GTK < 4.14
  # ou GLib < 2.80), le test vérifie que le script de construction refuse, avec
  # un message clair. Le résultat de chaque distribution est dans l'annotation
  # de l'exécution.
  distributions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 60
    # Chemin absolu : après setup-go, le PATH que le lanceur donne au conteneur
    # de Rocky Linux 10 ne contient plus /usr/bin, et « sh » n'est plus trouvé
    # (code 127). Le script remet les dossiers système dans le PATH.
    defaults:
      run:
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 13",                  image: "debian:13",                       family: debian, expect: "" }
          - { name: "Ubuntu 26.04",               image: "ubuntu:26.04",                    family: debian, expect: "" }
          - { name: "Ubuntu 24.04",               image: "ubuntu:24.04",                    family: debian, expect: "" }
          - { name: "Fedora",                     image: "fedora:latest",                   family: redhat, expect: "" }
          - { name: "CentOS Stream 10",           image: "quay.io/centos/centos:stream10",  family: redhat, expect: "" }
          - { name: "AlmaLinux 10",               image: "almalinux:10",                    family: redhat, expect: "" }
          - { name: "Rocky Linux 10",             image: "rockylinux/rockylinux:10",        family: redhat, expect: "" }
          - { name: "Debian 12 (refus attendu)",  image: "debian:12",                       family: debian, expect: refus }
          - { name: "Ubuntu 22.04 (refus attendu)", image: "ubuntu:22.04",                  family: debian, expect: refus }
          - { name: "AlmaLinux 9 (refus attendu)", image: "almalinux:9",                    family: redhat, expect: refus }
    env:
      CGO_ENABLED: "1"
      GSK_RENDERER: cairo
      GTK_A11Y: none
      NO_AT_BRIDGE: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      # git d'abord : le script de construction lit la date du dernier commit.
      - name: Install git
        run: |
          if command -v apt-get > /dev/null; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates tar gzip
          else
            dnf -y install git tar gzip
          fi
      - uses: actions/checkout@v4
      - name: PATH before setup-go
        run: echo "::notice title=PATH avant setup-go::$PATH ; bash=$(command -v bash) ; sh=$(command -v sh)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: PATH after setup-go
        run: echo "::notice title=PATH après setup-go::$PATH ; bash=$(command -v bash) ; sh=$(command -v sh) ; go=$(command -v go)"
      # Les outils que le script suppose présents : si une image minimale en
      # manque un, l'annotation le dit (les journaux ne se lisent pas sans
      # téléchargement).
      - name: Tools the script needs
        run: |
          PATH="$PATH:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          missing=""
          for tool in bash env tee tail awk sed grep sort tr seq mktemp dirname; do
            command -v "$tool" > /dev/null || missing="$missing $tool"
          done
          echo "::notice title=Outils::manquants :${missing:- aucun}; shell=$SHELL; $(. /etc/os-release && echo "$PRETTY_NAME")"
      - name: Build the package, install it, run it
        run: /usr/bin/bash .github/scripts/test-distribution.sh ${{ matrix.family }} ${{ matrix.expect }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-${{ matrix.family }}-${{ strategy.job-index }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Windows 10 et 11 : la CI n'a ni l'un ni l'autre, seulement des Windows
  # Server. windows-2022 (le plus ancien proposé) sert de repère pour Windows 10,
  # windows-latest (Windows Server 2025) pour Windows 11 ; la recette sur les
  # vraies machines reste à faire (§14 de ARCHITECTURE.md).
  windows-package:
    name: Windows package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      # The same entry point as a user's: it checks MSYS2 and its packages,
      # installs what is missing (-Oui answers yes), then builds both packages
      # as -Patch, which also checks that VERSION is updated after the build.
      # Windows PowerShell 5.1 on purpose: it is what a user has. The steps
      # are in a script so that a failure leaves its last lines as an error
      # annotation on the run.
      - name: Build with build-windows.ps1
        shell: powershell
        run: .\.github\scripts\windows-package.ps1 -Step build
      - name: Run the portable version with only Windows' own PATH
        shell: powershell
        run: .\.github\scripts\windows-package.ps1 -Step portable
      - name: Install, run and uninstall with the installer
        shell: powershell
        run: .\.github\scripts\windows-package.ps1 -Step installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ matrix.os }}
          path: |
            *_windows-portable.zip
            *_windows-setup.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots-${{ matrix.os }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Check that build-windows.ps1 -Clean removes the packages
        shell: powershell
        run: .\.github\scripts\windows-package.ps1 -Step clean
