# SPDX-License-Identifier: GPL-3.0-only

# Publishes a version: a "vX.Y.Z" tag pushed to a commit of main builds
# the packages of that version, tries them, then creates the GitHub release with the
# packages as attachments and the CHANGELOG sections (in English, then in
# French) as text.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must be that of VERSION and sit on a commit of main: otherwise the
# workflow stops before building anything.
#
# The packages are built without changing VERSION (--no-version-change): those
# of the CI workflow carry the next version, because it tries the version
# change, and are not suitable for a release.
#
# The workflow also runs, without publishing anything, when it is modified in a
# pull request and on demand ("Run workflow"): that is how it is tried
# before there is a tag.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release-notes.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Before building: the tag states the version in VERSION, it is on main, and
  # the two CHANGELOGs (CHANGELOG.md and CHANGELOG.fr.md) have a section for
  # this version.
  check:
    name: Version and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is the version, and it is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error title=Tag::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
          case "$version" in
            *-*) echo "::error title=Version::VERSION ($version) has a suffix: no pre-release version is published"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag::tag $GITHUB_REF_NAME is not on a commit of main"
            exit 1
          fi
      - name: Both CHANGELOGs have a section for this version
        run: .github/scripts/release-notes.sh "$(tr -d '[:space:]' < VERSION)"

  # The Linux packages are tied to the libraries of the machine that built
  # them. The .deb is built on Ubuntu 24.04 (the oldest supported system of
  # the Debian family: it also installs on Debian 13) and
  # the .rpm on AlmaLinux 10 (a RHEL 10 clone: it also installs on
  # Fedora). The script is that of the "distributions" job of the CI: it builds
  # the package, installs it with apt or dnf, runs the installed program and the 14
  # acceptance tests.
  linux:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 60
    defaults:
      run:
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ".deb (Ubuntu 24.04)", image: "ubuntu:24.04",   family: debian, artifact: package-deb }
          - { name: ".rpm (AlmaLinux 10)", image: "almalinux:10",   family: redhat, artifact: package-rpm }
    env:
      CGO_ENABLED: "1"
      GSK_RENDERER: cairo
      GTK_A11Y: none
      NO_AT_BRIDGE: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      # git first: the build script reads the date of the last commit.
      - name: Install git
        run: |
          if command -v apt-get > /dev/null; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates tar gzip
          else
            dnf -y install git tar gzip
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the package, install it, run it
        run: /usr/bin/bash .github/scripts/test-distribution.sh ${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            imageprintlayout_*.deb
            imageprintlayout-*.rpm
          if-no-files-found: error
          retention-days: 14

  # Windows: a single system is enough, the packages are the same for Windows 10
  # and 11 (MSYS2 UCRT64, 64-bit). The packages are built the way a
  # user does (build-windows.ps1), then the portable version and the installer
  # are run with only the Windows PATH.
  windows:
    name: Windows (installer and portable version)
    needs: check
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build the packages of the version in VERSION
        shell: powershell
        run: .\.github\scripts\windows-package.ps1 -Step release
      - name: Run the portable version with only Windows' own PATH
        shell: powershell
        run: .\.github\scripts\windows-package.ps1 -Step portable
      - name: Install, run and uninstall with the installer
        shell: powershell
        run: .\.github\scripts\windows-package.ps1 -Step installer
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            imageprintlayout_*_windows-portable.zip
            imageprintlayout_*_windows-setup.exe
          if-no-files-found: error
          retention-days: 14

  # Only for a tag: the packages, their checksums, and the text of the
  # release (the CHANGELOG section in English, then the list of files, then
  # the same in French).
  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-files
          merge-multiple: true
      # One .sha256 file per package, next to it: "sha256sum -c file.sha256"
      # checks it once both are in the same folder.
      - name: Checksums and release notes
        run: |
          cd release-files
          for package in imageprintlayout*; do
            sha256sum "$package" > "$package.sha256"
          done
          cat ./*.sha256
          cd ..
          .github/scripts/release-notes.sh "$(tr -d '[:space:]' < VERSION)" release-files > release-notes.md
          cat release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Image Print Layout $version" \
            --notes-file release-notes.md
