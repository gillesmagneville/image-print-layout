<!--
  Icône de Pageslice : une feuille haute, un dessin, et deux lignes de
  coupure en pointillés qui la partagent en trois pages. Dessin original.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fb5"/>
      <stop offset="1" stop-color="#1b3a63"/>
    </linearGradient>
  </defs>
  <rect id="carre" x="8" y="8" width="240" height="240" rx="52" fill="url(#fond)"/>
  <rect id="ombre" x="75" y="35" width="112" height="196" rx="8" fill="#0d2240" opacity="0.35"/>
  <rect id="feuille" x="72" y="28" width="112" height="196" rx="8" fill="#ffffff"/>
  <g id="dessin" fill="none" stroke="#2f6fb5" stroke-width="5" stroke-linecap="round">
    <rect x="88" y="44" width="36" height="22" rx="3" fill="#cfe0f5" stroke="none"/>
    <path d="M132 55h36M132 66h24"/>
    <rect x="88" y="108" width="30" height="20" rx="3" fill="#cfe0f5" stroke="none"/>
    <rect x="138" y="108" width="30" height="20" rx="3" fill="#cfe0f5" stroke="none"/>
    <path d="M118 118h20" stroke-width="4"/>
    <path d="M88 142h80M88 152h56"/>
    <path d="M88 178h80M88 188h64M88 198h72"/>
  </g>
  <g id="coupures" stroke="#f6ad55" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 12">
    <path d="M52 92h152"/>
    <path d="M52 160h152"/>
  </g>
</svg>
